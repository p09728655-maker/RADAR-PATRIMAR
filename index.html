<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DB2126">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar Patrimar">
<title>Radar Diário — Patrimar</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  /* Marca Patrimar */
  --marca-vermelho:#DB2126;
  --marca-bordeaux:#A8140F;
  --marca-areia:#F7ECC0;
  --marca-grafite:#1F2328;

  /* Superfícies — tema claro */
  --bg:#F4F5F7;
  --surface:#FFFFFF;
  --surface-2:#FAFAFB;
  --border:#E2E5E9;
  --border-forte:#CBD1D8;

  /* Texto */
  --text:#1F2328;
  --text-2:#4C555F;
  --muted:#79828C;

  /* Status — deliberadamente distintos do vermelho de marca */
  --ok:#1D7A4C;
  --ok-bg:#E6F4EC;
  --atencao:#B4650A;
  --atencao-bg:#FDF2E0;
  --info:#1F5FA8;

  /* Espaçamento */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

  /* Forma */
  --r-sm:4px; --r-md:8px; --r-lg:12px;
  --sombra:0 1px 2px rgba(31,35,40,.06), 0 1px 3px rgba(31,35,40,.04);

  /* Tipografia */
  --font:'Calibri','Carlito','Segoe UI',system-ui,-apple-system,sans-serif;
  --fs-display:22px; --fs-h1:19px; --fs-h2:16px; --fs-body:15px;
  --fs-small:13px; --fs-caption:12px; --fs-label:11px;

  --max:1560px;
  --h-topo:64px;             /* medida em tempo real: a barra de seções encosta logo abaixo */
}
html[data-tema="escuro"]{
  --bg:#14171A;
  --surface:#1D2126;
  --surface-2:#22272D;
  --border:#2E353D;
  --border-forte:#3D454E;
  --text:#EDEFF2;
  --text-2:#B6BEC7;
  --muted:#8792A0;
  --ok:#4FBE85; --ok-bg:#16301F;
  --atencao:#E0A44A; --atencao-bg:#332510;
  --info:#6FA8E8;
  --sombra:0 1px 3px rgba(0,0,0,.35);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  font-size:var(--fs-body);
  line-height:1.5;
  color:var(--text);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  /* coluna única: o miolo cresce e o rodapé fica no pé da tela, sem vão branco */
  min-height:100vh;
  min-height:100dvh;
  display:flex;flex-direction:column;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:var(--r-sm)}
.oculto{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================
   CABEÇALHO
   ============================================================ */
.topo{
  background:var(--marca-grafite);
  color:#fff;
  border-bottom:3px solid var(--marca-vermelho);
  position:sticky; top:0; z-index:40;
}
.topo-in{
  max-width:var(--max); margin:0 auto;
  padding:var(--s3) var(--s5);
  display:flex; align-items:center; gap:var(--s4);
}
.marca{display:flex;align-items:center;gap:var(--s3);min-width:0}
.marca-logo{
  height:38px;width:auto;flex:0 0 auto;display:block;
  background:#fff;padding:5px 10px;border-radius:var(--r-md);
  box-shadow:0 1px 2px rgba(0,0,0,.28);
}
.marca-risco{width:1px;height:28px;flex:0 0 1px;background:rgba(255,255,255,.18)}
.marca-txt{min-width:0}
.marca-titulo{font-size:var(--fs-display);font-weight:700;line-height:1.15;letter-spacing:-.2px}
.marca-sub{font-size:var(--fs-caption);color:#A9B2BC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo-acoes{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}

.btn{
  display:inline-flex;align-items:center;gap:var(--s2);
  padding:var(--s2) var(--s3);
  border-radius:var(--r-md);
  font-size:var(--fs-small);font-weight:600;
  border:1px solid transparent;
  transition:background .15s, border-color .15s;
  min-height:38px;
}
.btn-topo{color:#E7EAEE;border-color:#3A424B;background:#262C33}
.btn-instalar{color:#fff;border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.10)}
.btn-instalar:hover{background:rgba(255,255,255,.18)}
.btn-topo:hover{background:#31383F}
.btn-primario{background:var(--marca-vermelho);color:#fff}
.btn-primario:hover{background:var(--marca-bordeaux)}
.btn svg{width:16px;height:16px;flex:0 0 16px}
.girando{animation:girar 1s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}

/* ============================================================
   ASSUNTOS DO DIA
   ============================================================ */
.assuntos{
  background:var(--marca-areia);
  border-bottom:1px solid #E3D5A4;
}
html[data-tema="escuro"] .assuntos{background:#2B2718;border-bottom-color:#3B3520}
.assuntos-in{
  max-width:var(--max);margin:0 auto;
  padding:var(--s3) var(--s5);
  display:flex;align-items:center;gap:var(--s3);
}
.assuntos-rot{
  font-size:var(--fs-label);font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:#6B5A16;white-space:nowrap;flex:0 0 auto;
}
html[data-tema="escuro"] .assuntos-rot{color:#C9B978}
.assuntos-lista{
  display:flex;gap:var(--s2);overflow-x:auto;padding-bottom:2px;
  scrollbar-width:thin;
}
.assuntos-lista::-webkit-scrollbar{height:4px}
.assuntos-lista::-webkit-scrollbar-thumb{background:#C9B978;border-radius:2px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px var(--s3);border-radius:100px;
  background:rgba(255,255,255,.75);
  border:1px solid #DFCE94;
  font-size:var(--fs-small);font-weight:600;color:#4A3F10;
  white-space:nowrap;transition:background .15s;
}
.chip:hover{background:#fff}
.chip[aria-pressed="true"]{background:var(--marca-grafite);border-color:var(--marca-grafite);color:#fff}
html[data-tema="escuro"] .chip{background:#3A3520;border-color:#4C4529;color:#E4D9A8}
html[data-tema="escuro"] .chip[aria-pressed="true"]{background:var(--marca-areia);color:#2B2718}
.chip-n{
  font-size:var(--fs-label);font-weight:700;
  background:rgba(0,0,0,.1);border-radius:100px;padding:1px 6px;
}
.chip[aria-pressed="true"] .chip-n{background:rgba(255,255,255,.22)}

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */
.nav{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  position:sticky;top:var(--h-topo);z-index:30;
}
.nav-in{max-width:var(--max);margin:0 auto;padding:0 var(--s5);display:flex;gap:var(--s5);overflow-x:auto}
.nav-in::-webkit-scrollbar{display:none}
.aba{
  padding:var(--s3) 2px var(--s3);
  font-size:var(--fs-body);font-weight:600;color:var(--muted);
  border-bottom:2px solid transparent;
  white-space:nowrap;display:flex;align-items:center;gap:var(--s2);
  transition:color .15s;
}
.aba:hover{color:var(--text)}
.aba[aria-selected="true"]{color:var(--marca-vermelho);border-bottom-color:var(--marca-vermelho)}
html[data-tema="escuro"] .aba[aria-selected="true"]{color:#F2727A;border-bottom-color:#F2727A}
/* A aba da casa fica marcada mesmo sem estar aberta, com a estrela da marca */
.aba-destaque{color:var(--marca-vermelho);font-weight:700}
html[data-tema="escuro"] .aba-destaque{color:#F2727A}
.aba-estrela{width:13px;height:13px;flex:0 0 13px;fill:#D9B414}
.aba-destaque .aba-n{border-color:var(--marca-vermelho);color:var(--marca-vermelho)}
html[data-tema="escuro"] .aba-destaque .aba-n{border-color:#F2727A;color:#F2727A}
.aba-n{
  font-size:var(--fs-label);font-weight:700;color:var(--muted);
  background:var(--bg);border:1px solid var(--border);
  border-radius:100px;padding:0 6px;min-width:20px;text-align:center;
}

/* ============================================================
   BARRA DE CONTROLE
   ============================================================ */
.controles{
  /* width:100% é necessário: margem automática em item de flex-column
     desliga o esticamento e o bloco encolheria para caber no conteúdo */
  width:100%;max-width:var(--max);margin:0 auto;
  padding:var(--s4) var(--s5) 0;
  display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;
}
.campo{position:relative;flex:1 1 300px;max-width:420px}
.campo svg{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--muted);pointer-events:none;
}
.campo input{
  width:100%;padding:9px var(--s3) 9px 34px;
  font-family:inherit;font-size:var(--fs-body);
  color:var(--text);background:var(--surface);
  border:1px solid var(--border-forte);border-radius:var(--r-md);
}
.campo input::placeholder{color:var(--muted)}
.campo input:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px rgba(31,95,168,.12)}
.limpar{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:var(--r-sm);color:var(--muted);
  display:grid;place-items:center;
}
.limpar:hover{background:var(--bg);color:var(--text)}
select{
  padding:9px var(--s3);font-family:inherit;font-size:var(--fs-small);
  color:var(--text);background:var(--surface);
  border:1px solid var(--border-forte);border-radius:var(--r-md);
  min-height:38px;cursor:pointer;
}
.btn-secundario{
  background:var(--surface);color:var(--text-2);
  border-color:var(--border-forte);min-height:38px;
}
.btn-secundario:hover{background:var(--surface-2);color:var(--text)}
.btn-secundario[aria-pressed="true"]{
  background:var(--marca-grafite);border-color:var(--marca-grafite);color:#fff;
}
html[data-tema="escuro"] .btn-secundario[aria-pressed="true"]{background:var(--marca-areia);color:#2B2718;border-color:var(--marca-areia)}
.contagem{font-size:var(--fs-small);color:var(--muted);margin-left:auto}

/* ============================================================
   RESUMO DO DIA
   ============================================================ */
.resumo{grid-column:1/-1;display:flex;flex-direction:column;gap:var(--s5)}
.resumo-abertura{
  border-left:3px solid var(--marca-vermelho);
  padding-left:var(--s4);
}
.resumo-titulo{font-size:var(--fs-h1);font-weight:700;line-height:1.2}
.resumo-linha{font-size:var(--fs-small);color:var(--muted);margin-top:2px}
.resumo-termos{margin-top:var(--s3);font-size:var(--fs-small);color:var(--text-2)}
.resumo-termos b{color:var(--text)}

/* ============================================================
   MURAL INTERNO
   ============================================================ */
.mural{
  grid-column:1/-1;
  border:1px solid var(--border);border-left:3px solid var(--marca-vermelho);
  border-radius:var(--r-md);background:var(--surface);
  padding:var(--s4);margin-bottom:var(--s2);
}
.mural-topo{
  display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  margin-bottom:var(--s3);
}
.mural-nome{font-size:var(--fs-h2);font-weight:700}
.mural-conta{font-size:var(--fs-label);color:var(--muted);font-weight:600}
.mural-acoes{margin-left:auto;display:flex;gap:var(--s2)}
.mural-lista{display:flex;flex-direction:column;gap:var(--s3)}
.mural-item{
  display:flex;gap:var(--s3);align-items:flex-start;
  padding-left:var(--s3);border-left:2px solid var(--border);
  break-inside:avoid;
}
.mural-corpo{min-width:0;flex:1}
.mural-t{font-weight:600;line-height:1.35}
.mural-x{font-size:var(--fs-small);color:var(--text-2);margin-top:2px;white-space:pre-wrap}
.mural-m{font-size:var(--fs-caption);color:var(--muted);margin-top:4px}
.mural-selo{
  font-size:var(--fs-label);font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  padding:1px 7px;border-radius:100px;flex:0 0 auto;
  background:var(--marca-areia);color:#5C4B12;
}
html[data-tema="escuro"] .mural-selo{background:#2B2718;color:#E4DCC0}
.mural-selo.noticia{background:var(--ok-bg);color:var(--ok)}
.mural-tirar{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 var(--s2);border-radius:var(--r-sm)}
.mural-tirar:hover{color:var(--atencao);background:var(--surface-2)}
.mural-vazio{font-size:var(--fs-small);color:var(--muted)}

/* Alfinete no cartão, só no modo de publicação */
.n-fixar{
  position:absolute;top:6px;right:6px;
  width:28px;height:28px;border-radius:var(--r-sm);
  display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--border);color:var(--muted);
}
.n-fixar:hover{color:var(--marca-vermelho);border-color:var(--marca-vermelho)}
.n-fixar svg{width:15px;height:15px}

/* Caixa de publicação */
#dlgPublicar{
  border:1px solid var(--border-forte);border-radius:var(--r-lg);
  background:var(--surface);color:var(--text);
  padding:0;width:min(560px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.22);
}
#dlgPublicar::backdrop{background:rgba(15,18,22,.55)}
.dlg{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s5)}
.dlg-topo{display:flex;align-items:center;gap:var(--s3);font-size:var(--fs-h2)}
.dlg-topo .dica-x{margin-left:auto}
.dlg-campo{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-small)}
.dlg-campo span{color:var(--text-2);font-weight:600}
.dlg-campo i{font-weight:400;color:var(--muted);font-style:normal}
.dlg-campo input,.dlg-campo textarea{
  font-family:inherit;font-size:var(--fs-body);color:var(--text);
  background:var(--surface-2);border:1px solid var(--border-forte);
  border-radius:var(--r-md);padding:8px var(--s3);width:100%;resize:vertical;
}
.dlg-campo input:focus,.dlg-campo textarea:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px rgba(31,95,168,.12)}
.dlg-dupla{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.dlg-erro{font-size:var(--fs-small);color:var(--atencao)}
.dlg-pe{display:flex;gap:var(--s2);justify-content:flex-end;margin-top:var(--s2)}

@media (max-width:640px){ .dlg-dupla{grid-template-columns:1fr} }

/* Leitura escrita pela IA, no topo do resumo */
.leitura{
  border:1px solid var(--border);border-left:3px solid var(--marca-grafite);
  border-radius:var(--r-md);background:var(--surface);
  padding:var(--s4);
}
html[data-tema="escuro"] .leitura{border-left-color:var(--marca-areia)}
.leitura-espera{
  display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  font-size:var(--fs-small);color:var(--muted);
  background:none;border-style:dashed;
}
.leitura-texto p{margin-bottom:var(--s2);line-height:1.55}
.leitura-texto p:last-child{margin-bottom:0}
.leitura-pe{
  display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--border);
  font-size:var(--fs-caption);color:var(--muted);
}
.leitura-pe .btn{margin-left:auto}
.leitura-erro{margin-top:var(--s3);font-size:var(--fs-small);color:var(--atencao)}
.leitura-ajuda{margin-top:var(--s1);font-size:var(--fs-caption);color:var(--text-2)}

.resumo-bloco{break-inside:avoid}
.resumo-cabeca{
  display:flex;align-items:baseline;gap:var(--s2);
  border-bottom:1px solid var(--border);padding-bottom:var(--s2);margin-bottom:var(--s3);
}
.resumo-secao{font-size:var(--fs-h2);font-weight:700}
.resumo-qtd{font-size:var(--fs-label);color:var(--muted);font-weight:600}
.resumo-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:var(--s3) var(--s5)}
.resumo-item{
  display:block;break-inside:avoid;
  padding-left:var(--s3);border-left:2px solid var(--border);
}
.resumo-item:hover{border-left-color:var(--marca-vermelho)}
.resumo-item-t{font-weight:600;line-height:1.35}
.resumo-item:hover .resumo-item-t{color:var(--marca-bordeaux)}
.resumo-item-m{font-size:var(--fs-caption);color:var(--muted);margin-top:2px}

/* Cabeçalho impresso: só existe no papel */
.folha-topo{display:none}

/* ============================================================
   LISTA DE NOTÍCIAS
   ============================================================ */
main{max-width:var(--max);margin:0 auto;padding:var(--s4) var(--s5) var(--s7);width:100%;flex:1 0 auto}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:var(--s3)}

.noticia{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:var(--s4);
  display:flex;flex-direction:column;gap:var(--s2);
  transition:border-color .15s, box-shadow .15s, transform .15s;
}
.noticia:hover{border-color:var(--border-forte);box-shadow:var(--sombra);transform:translateY(-1px)}
.noticia:focus-visible{outline:2px solid var(--info);outline-offset:2px}

.n-meta{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;font-size:var(--fs-caption)}
.n-veiculo{
  font-weight:700;color:var(--marca-bordeaux);
  text-transform:uppercase;letter-spacing:.4px;font-size:var(--fs-label);
}
html[data-tema="escuro"] .n-veiculo{color:#F2727A}
.n-origem{color:var(--text-2);font-weight:600}
.n-ponto{color:var(--border-forte)}
.n-hora{color:var(--muted)}
.n-novo{
  background:var(--ok-bg);color:var(--ok);
  font-size:var(--fs-label);font-weight:700;
  padding:1px 7px;border-radius:100px;
  text-transform:uppercase;letter-spacing:.4px;
}
.n-titulo{
  font-size:var(--fs-h2);font-weight:600;line-height:1.35;
  color:var(--text);
}
.noticia:hover .n-titulo{color:var(--marca-bordeaux)}
html[data-tema="escuro"] .noticia:hover .n-titulo{color:#F2727A}
.n-resumo{
  font-size:var(--fs-small);color:var(--text-2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
mark{background:var(--marca-areia);color:inherit;padding:0 2px;border-radius:2px}
html[data-tema="escuro"] mark{background:#4A431F;color:#F3E7B6}

/* ============================================================
   ESTADOS
   ============================================================ */
.estado{
  grid-column:1/-1;text-align:center;
  padding:var(--s7) var(--s5);color:var(--muted);
}
.estado svg{width:32px;height:32px;margin-bottom:var(--s3);opacity:.5}
.estado-t{font-size:var(--fs-h2);font-weight:600;color:var(--text-2);margin-bottom:var(--s1)}
.estado-d{font-size:var(--fs-small);max-width:420px;margin:0 auto}

.esqueleto{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:var(--s4);
}
.esq-linha{
  height:12px;border-radius:var(--r-sm);
  background:linear-gradient(90deg,var(--border) 25%,var(--surface-2) 50%,var(--border) 75%);
  background-size:200% 100%;animation:brilho 1.4s ease-in-out infinite;
  margin-bottom:var(--s2);
}
@keyframes brilho{to{background-position:-200% 0}}

/* ============================================================
   AVISO DE FONTES
   ============================================================ */
.dica{
  max-width:var(--max);margin:0 auto;
  padding:var(--s3) var(--s5);
  display:flex;gap:var(--s3);align-items:center;
  font-size:var(--fs-small);color:var(--text-2);
}
.dica-faixa{background:var(--marca-areia);border-bottom:1px solid var(--border)}
html[data-tema="escuro"] .dica-faixa{background:#2B2718;border-bottom-color:#3A3524}
html[data-tema="escuro"] .dica{color:#E4DCC0}
.dica svg{width:18px;height:18px;flex:0 0 18px}
.dica-x{
  margin-left:auto;flex:0 0 auto;
  border:0;background:none;cursor:pointer;color:inherit;opacity:.65;
  padding:var(--s1) var(--s2);border-radius:var(--r-sm);line-height:1;
}
.dica-x:hover{opacity:1;background:rgba(0,0,0,.06)}

.aviso{
  grid-column:1/-1;
  display:flex;gap:var(--s3);align-items:flex-start;
  background:var(--atencao-bg);
  border:1px solid var(--atencao);border-left-width:3px;
  border-radius:var(--r-md);padding:var(--s3) var(--s4);
  font-size:var(--fs-small);color:var(--atencao);
  margin-bottom:var(--s2);
}
.aviso svg{width:18px;height:18px;flex:0 0 18px;margin-top:1px}
.aviso-detalhe{margin-top:var(--s2);font-size:var(--fs-label);opacity:.8;font-family:ui-monospace,Consolas,monospace}
.faixa-arquivo{
  grid-column:1/-1;
  display:flex;gap:var(--s3);align-items:flex-start;
  background:var(--marca-areia);
  border:1px solid var(--border);border-left:3px solid var(--marca-grafite);
  border-radius:var(--r-md);padding:var(--s3) var(--s4);
  font-size:var(--fs-small);color:#5C4B12;
  margin-bottom:var(--s2);
}
html[data-tema="escuro"] .faixa-arquivo{background:#2B2718;border-left-color:var(--marca-areia);color:#E4DCC0}
.faixa-arquivo svg{width:18px;height:18px;flex:0 0 18px;margin-top:1px}
.aviso b{display:block;margin-bottom:2px}

/* ============================================================
   RODAPÉ
   ============================================================ */
.rodape{
  border-top:1px solid var(--border);
  background:var(--surface);
  padding:var(--s5);
  margin-top:auto;
}
.rodape-in{
  max-width:var(--max);margin:0 auto;
  display:flex;gap:var(--s4);flex-wrap:wrap;align-items:center;
  font-size:var(--fs-caption);color:var(--muted);
}
.fontes{display:flex;gap:var(--s2);flex-wrap:wrap}
.fonte-tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 9px;border-radius:100px;
  border:1px solid var(--border);background:var(--surface-2);
  font-size:var(--fs-label);font-weight:600;color:var(--text-2);
}
.bolinha{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.bolinha.ok{background:var(--ok)}
.bolinha.falha{background:var(--atencao)}

/* ============================================================
   RESPONSIVO
   ============================================================ */
/* Tablet: respiro menor nas laterais e cartão que ainda cabe em duas colunas */
@media (max-width:1100px){
  .topo-in,.nav-in,.controles,main,.assuntos-in,.rodape,.dica{padding-left:var(--s4);padding-right:var(--s4)}
  .grade{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
  .campo{max-width:none}
}
@media (max-width:860px){
  .topo-in,.nav-in,.controles,main,.assuntos-in,.rodape{padding-left:var(--s4);padding-right:var(--s4)}
  .marca-titulo{font-size:18px}
  .marca-sub{display:none}
  .marca-logo{height:32px;padding:4px 8px}
  .marca{gap:var(--s2)}
  .dica{padding-left:var(--s4);padding-right:var(--s4)}
  .btn-rotulo{display:none}
  .btn{padding:var(--s2)}
  /* No celular esses dois ficam numa linha só para eles: cabe o nome por extenso */
  #btnResumo .btn-rotulo,#btnImprimir .btn-rotulo{display:inline}
  #btnResumo,#btnImprimir{padding:var(--s2) var(--s3)}
  .contagem{margin-left:0;width:100%;order:9}
  #btnResumo,#btnImprimir{margin-left:0}
  .assuntos-rot{display:none}
}
/* Celular: uma notícia por vez */
@media (max-width:640px){
  .grade{grid-template-columns:1fr;gap:var(--s2)}
  .resumo-lista{grid-template-columns:1fr}
  .resumo{gap:var(--s4)}
}
@media (min-width:1500px){
  .grade{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
  .topo-in,.nav-in,.controles,main,.assuntos-in,.rodape,.dica{padding-left:var(--s6);padding-right:var(--s6)}
}
@media print{
  @page{ margin:14mm; }

  .topo,.controles,.nav,.assuntos,.dica-faixa,.rodape{display:none !important}
  body{background:#fff;color:#000;font-size:10.5pt;display:block}
  main{max-width:none;padding:0;flex:none}

  .resumo{gap:14pt}
  .mural{border:0;border-left:2px solid #DB2126;border-radius:0;padding:0 0 0 8px;background:none;margin-bottom:10pt}
  .mural-acoes,.mural-tirar,.n-fixar{display:none}

<script>
"use strict";

/* ============================================================
   1. CONFIGURAÇÃO
   ============================================================
   Para trocar o proxy público por um Apps Script próprio,
   preencha PROXY_PROPRIO com a URL do /exec. Ele passa a ter
   prioridade sobre os proxies públicos.
   ============================================================ */
const CONFIG = {
  // Ponte própria, no mesmo domínio (api/feed.js). Fica sempre em primeiro
  // lugar; as pontes públicas seguem como reserva se ela não existir.
  PROXY_PROPRIO: "/api/feed?url=",
  MAX_POR_FONTE: 14,
  RESUMO_POR_SECAO: 6,               // manchetes por seção no resumo do dia
  ARQUIVO_ANOS: 4,                   // quantos anos entram na busca de arquivo
  INTERVALO_MS: 10 * 60 * 1000,      // atualização automática: 10 min
  TIMEOUT_MS: 13000,                 // por tentativa de ponte
  TENTATIVAS: 4,                     // pontes testadas por endereço
  CONCORRENCIA: 6,                   // requisições simultâneas no painel inteiro
  INTERVALO_DISPARO: 90,             // ms entre disparos, para não parecer enxurrada
  ESPERA_LIMITE: 900                 // pausa depois de um "excesso de requisições"
};

const gn = q => "https://news.google.com/rss/search?q=" +
  encodeURIComponent(q) + "&hl=pt-BR&gl=BR&ceid=BR:pt-419";

const SECOES = [
  { id:"patrimar", nome:"Patrimar", destaque:true, fontes:[
    { v:"Patrimar Móveis",    u:gn('"Patrimar Móveis"') },
    { v:"Menções à marca",    u:gn('"Patrimar" móveis OR planejados OR moveleira') },
    { v:"Móveis planejados",  u:gn('"móveis planejados" mercado OR fábrica OR lançamento') },
    { v:"Concorrência",       u:gn('Todeschini OR "Dell Anno" OR Italínea OR Bontempo OR "SCA Móveis" planejados') },
    { v:"Varejo e franquias", u:gn('franquia de móveis planejados OR loja de móveis planejados expansão') }
  ]},
  { id:"ppcp", nome:"PPCP e Indústria", fontes:[
    { v:"Produção industrial", u:gn('produção industrial IBGE PIM indústria brasileira') },
    { v:"PCP e Lean",          u:gn('"planejamento e controle da produção" OR "lean manufacturing" OR PCP indústria') },
    { v:"Manufatura 4.0",      u:gn('"indústria 4.0" automação manufatura fábrica') },
    { v:"Supply chain",        u:gn('"cadeia de suprimentos" OR "supply chain" logística indústria Brasil') },
    { v:"CNI / Indústria",     u:gn('CNI confiança do empresário industrial capacidade instalada') },
    { v:"Custos e insumos",    u:gn('custo de produção indústria OR preço do aço OR insumos industriais Brasil') },
    { v:"New York Times",      u:"https://rss.nytimes.com/services/xml/rss/nyt/Business.xml",
                               reserva:gn('site:nytimes.com manufacturing OR supply chain') }
  ]},
  { id:"moveleiro", nome:"Moveleiro", fontes:[
    { v:"Setor moveleiro",   u:gn('"indústria moveleira" OR "setor moveleiro"') },
    { v:"Móveis Brasil",     u:gn('fábrica de móveis produção exportação') },
    { v:"Madeira e MDF",     u:gn('MDF OR MDP OR "painéis de madeira" preço mercado') },
    { v:"Polos moveleiros",  u:gn('Votuporanga OR Mirassol OR "Bento Gonçalves" OR Arapongas móveis') },
    { v:"Movelaria/varejo",  u:gn('varejo de móveis vendas mercado moveleiro') },
    { v:"Entidades e feiras",u:gn('Movergs OR Sindmóveis OR Abimóvel OR Movelsul OR FIMMA móveis') }
  ]},
  { id:"ia", nome:"Inteligência Artificial", fontes:[
    { v:"IA na indústria",  u:gn('inteligência artificial indústria manufatura') },
    { v:"IA em produção",   u:gn('inteligência artificial "chão de fábrica" OR "planejamento da produção" OR "previsão de demanda"') },
    { v:"IA no Brasil",     u:gn('inteligência artificial empresas Brasil') },
    { v:"MIT Tech Review",  u:"https://www.technologyreview.com/topic/artificial-intelligence/feed", reserva:gn('site:technologyreview.com artificial intelligence') },
    { v:"Ars Technica",     u:"https://arstechnica.com/ai/feed/", reserva:gn('site:arstechnica.com AI') },
    { v:"The Verge",        u:"https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", reserva:gn('site:theverge.com artificial intelligence') },
    { v:"TechCrunch",       u:"https://techcrunch.com/category/artificial-intelligence/feed/", reserva:gn('site:techcrunch.com artificial intelligence') }
  ]}
];


/* ============================================================
   2. ESTADO
   ============================================================ */
const estado = {
  secao: "patrimar",         // o painel abre na aba da casa
  brutos: {},                // { secaoId: { veiculo: [item, ...] } }
  itens: {},                 // { secaoId: [item, ...] } — já deduplicado e ordenado
  falhas: {},                // { secaoId: [veiculo, ...] }
  carregando: true,          // primeira pintura: mostra esqueleto
  emCarga: false,            // trava contra duas atualizações ao mesmo tempo
  resumo: false,             // visão de resumo do dia, pensada para o papel
  arquivo: null,             // { ano, termo, itens, carregando, erro } quando busca no arquivo
  leitura: null,             // { texto, carregando, erro } da leitura escrita pela IA
  mural: { itens:[], carregado:false, erro:"", comoResolver:"" },
  publicando: false,         // modo de publicação: mostra alfinete nos cartões
  senhaMural: "",            // fica só na memória da aba, nunca é gravada
  progresso: { feitas:0, total:0 },
  busca: "",
  veiculo: "",
  periodo: 0,
  assuntoAtivo: null,
  ultimaVisita: 0,
  ultimaAtualizacao: null
};
SECOES.forEach(s => { estado.brutos[s.id] = {}; estado.itens[s.id] = []; estado.falhas[s.id] = []; });

/* Armazenamento local tolerante a falha (modo restrito / navegação privada) */
const guardar = {
  ler(chave){ try{ const v = localStorage.getItem(chave); return v ? JSON.parse(v) : null; }catch{ return null; } },
  gravar(chave, valor){ try{ localStorage.setItem(chave, JSON.stringify(valor)); }catch{} }
};

/* ============================================================
   3. UTILITÁRIOS
   ============================================================ */
const el = id => document.getElementById(id);

function escapar(s){
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function limparHtml(s){
  const d = document.createElement("div");
  d.innerHTML = String(s ?? "");
  return (d.textContent || "").replace(/\s+/g, " ").trim();
}

function tempoRelativo(ts){
  if(!ts) return "";
  const min = Math.floor((Date.now() - ts) / 60000);
  if(min < 1)  return "agora";
  if(min < 60) return "há " + min + " min";
  const h = Math.floor(min / 60);
  if(h < 24) return "há " + h + "h";
  const d = Math.floor(h / 24);
  if(d === 1) return "ontem";
  if(d < 7)  return "há " + d + " dias";
  return new Date(ts).toLocaleDateString("pt-BR", { day:"2-digit", month:"short" });
}

function dataExtenso(d){
  const s = d.toLocaleDateString("pt-BR", { weekday:"long", day:"numeric", month:"long" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ============================================================
   4. PONTES DE ACESSO AOS FEEDS
   ============================================================
   O navegador não lê RSS de outro domínio sem um intermediário.
   O painel tenta várias pontes públicas em sequência, guarda qual
   delas respondeu e começa por ela na próxima vez. Uma ponte que
   falha seguidamente vai para o fim da fila sozinha.
   ============================================================ */
const PONTES = [
  { id:"allorigins", tipo:"texto",
    montar:u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u) },
  { id:"codetabs", tipo:"texto",
    montar:u => "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u) },
  { id:"feed2json", tipo:"feed2json",
    montar:u => "https://www.toptal.com/developers/feed2json/convert?url=" + encodeURIComponent(u) },
  { id:"corsproxy", tipo:"texto",
    montar:u => "https://corsproxy.io/?url=" + encodeURIComponent(u) },
  { id:"rss2json", tipo:"rss2json",
    montar:u => "https://api.rss2json.com/v1/api.json?count=20&rss_url=" + encodeURIComponent(u) },
  { id:"allorigins-json", tipo:"envelope",
    montar:u => "https://api.allorigins.win/get?url=" + encodeURIComponent(u) },
  { id:"cors-lol", tipo:"texto",
    montar:u => "https://api.cors.lol/?url=" + encodeURIComponent(u) }
];

const pontes = {
  falhas: new Map(),                       // id -> falhas seguidas
  motivos: new Map(),                      // id -> último motivo, para o aviso de queda

  propria(){
    if(!CONFIG.PROXY_PROPRIO) return null;
    return { id:"própria", tipo:"texto", montar:u => CONFIG.PROXY_PROPRIO + encodeURIComponent(u) };
  },

  todas(){
    const p = this.propria();
    return p ? [p, ...PONTES] : PONTES;
  },

  /* A ponte própria vem sempre na frente: é do mesmo domínio, não tem CORS
     nem cota. As públicas ficam de reserva e entram em rodízio — se todas as
     fontes partissem da mesma, as 26 chamadas cairiam no mesmo serviço e
     voltariam como excesso de requisições, que foi o que esvaziou o painel. */
  ordem(desvio = 0){
    const postas = PONTES
      .map((p, i) => ({ p, i, f: this.falhas.get(p.id) || 0 }))
      .sort((a, b) => a.f - b.f || a.i - b.i);
    const vivas = postas.filter(o => o.f < 3);
    let lista = (vivas.length ? vivas : postas).map(o => o.p);

    if(lista.length > 1){
      const corte = ((desvio % lista.length) + lista.length) % lista.length;
      lista = [...lista.slice(corte), ...lista.slice(0, corte)];
    }

    const propria = this.propria();
    const desistiu = (this.falhas.get("própria") || 0) >= 3;   // sem /api no destino
    return propria && !desistiu ? [propria, ...lista] : lista;
  },

  // Cada atualização começa com o placar limpo: ponte que voltou volta a ser tentada
  zerar(){ this.falhas.clear(); this.motivos.clear(); },

  registrar(id, ok, motivo){
    if(ok){ this.falhas.set(id, 0); this.motivos.delete(id); return; }
    this.falhas.set(id, (this.falhas.get(id) || 0) + 1);
    if(motivo) this.motivos.set(id, motivo);
  },

  // Linha curta de diagnóstico para quando nada responde
  resumo(){
    return [...this.motivos].map(([id, motivo]) => id + ": " + motivo).join(" · ");
  }
};

/* Fila única para o painel inteiro, com um respiro entre os disparos. Sem ela
   as 26 fontes saem juntas, o navegador segura a maioria na fila de conexões
   e o cronômetro estoura antes de a requisição sair. */
const fila = { ativas: 0, espera: [], ultimoDisparo: 0, agendado: false };

function enfileirar(tarefa){
  return new Promise(resolver => {
    fila.espera.push(() => tarefa().then(resolver, resolver));
    bombear();
  });
}

function bombear(){
  while(fila.ativas < CONFIG.CONCORRENCIA && fila.espera.length){
    const falta = CONFIG.INTERVALO_DISPARO - (Date.now() - fila.ultimoDisparo);
    if(falta > 0){
      if(!fila.agendado){
        fila.agendado = true;
        setTimeout(() => { fila.agendado = false; bombear(); }, falta);
      }
      return;
    }
    fila.ultimoDisparo = Date.now();
    const proxima = fila.espera.shift();
    fila.ativas++;
    proxima().finally(() => { fila.ativas--; bombear(); });
  }
}

const esperar = ms => new Promise(r => setTimeout(r, ms));

/* ============================================================
   5. LEITURA DOS FEEDS
   ============================================================ */
function decodificarConteudo(s){
  const texto = String(s ?? "");
  const marca = texto.match(/^data:[^,]*?(;base64)?,/i);
  if(!marca) return texto;
  const corpo = texto.slice(marca[0].length);
  if(!marca[1]) return decodeURIComponent(corpo);
  try{
    const bruto = atob(corpo);
    const bytes = Uint8Array.from(bruto, c => c.charCodeAt(0));
    return new TextDecoder("utf-8").decode(bytes);
  }catch{ return corpo; }
}

/* Feeds usam prefixos (dc:date, content:encoded). Comparar pelo nome
   local evita depender de namespace declarado. */
function filhos(no, ...nomes){
  const alvo = nomes.map(n => n.toLowerCase());
  return [...no.children].filter(f =>
    alvo.includes(String(f.localName || f.nodeName).toLowerCase()));
}

function texto(no, ...nomes){
  for(const nome of nomes){
    const f = filhos(no, nome)[0];
    const t = f && (f.textContent || "").trim();
    if(t) return t;
  }
  return "";
}

function extrairLink(no){
  const candidatos = [...filhos(no, "link"), ...filhos(no, "origLink"), ...filhos(no, "guid")];
  for(const c of candidatos){
    const href = c.getAttribute?.("href");
    const rel  = c.getAttribute?.("rel");
    if(href && (!rel || rel === "alternate")) return href;
  }
  for(const c of candidatos){
    const t = (c.textContent || "").trim();
    if(/^https?:\/\//i.test(t)) return t;
  }
  return "";
}

function paraTs(bruto){
  if(!bruto) return 0;
  let t = Date.parse(bruto);
  if(!Number.isFinite(t)) t = Date.parse(String(bruto).trim().replace(" ", "T") + "Z");
  if(!Number.isFinite(t)) return 0;
  return Math.min(t, Date.now());          // feed com fuso errado não vira "notícia do futuro"
}

function chaveDe(titulo){
  return titulo.toLowerCase().replace(/[^a-zà-ú0-9]/gi, "").slice(0, 70);
}

function montarItem({ titulo, link, resumo, origem, dataBruta, veiculo }){
  titulo = limparHtml(titulo);
  if(!titulo || !link) return null;

  // Google News carimba " - Veículo" no fim da manchete; o veículo vai no rótulo
  origem = limparHtml(origem);
  if(origem && titulo.toLowerCase().endsWith(" - " + origem.toLowerCase())){
    titulo = titulo.slice(0, -(origem.length + 3)).trim();
  }

  resumo = limparHtml(resumo);
  if(resumo.length > 240) resumo = resumo.slice(0, 240).trim() + "…";
  if(resumo.startsWith(titulo.slice(0, 30)) || /^<?a href/i.test(resumo)) resumo = "";

  return { titulo, link, resumo, origem, veiculo, ts: paraTs(dataBruta), chave: chaveDe(titulo) };
}

/* Nem todo feed é UTF-8. O da Folha vem em ISO-8859-1 e, lido como UTF-8,
   transforma "vigário" em "vig?rio". A codificação certa é procurada em
   ordem: cabeçalho HTTP, declaração do próprio XML e os dois palpites
   comuns. Vence a primeira leitura sem caractere perdido. */
async function lerTexto(r){
  const bytes = new Uint8Array(await r.arrayBuffer());
  const tipo = r.headers.get("content-type") || "";
  const espiada = new TextDecoder("windows-1252").decode(bytes.slice(0, 400));

  const candidatas = [
    (tipo.match(/charset=["']?([\w-]+)/i) || [])[1],
    (espiada.match(/encoding=["']([\w-]+)["']/i) || [])[1],
    "utf-8",
    "windows-1252"
  ].filter(Boolean).map(c => c.toLowerCase());

  let primeira = null;
  for(const nome of new Set(candidatas)){
    let texto;
    try{ texto = new TextDecoder(nome).decode(bytes); }
    catch{ continue; }
    if(primeira === null) primeira = texto;
    if(!texto.includes("\uFFFD")) return texto;
  }
  return primeira ?? "";
}

function lerFeed(xmlTexto, veiculo){
  const bruto = String(xmlTexto ?? "").replace(/^﻿/, "").trim();
  if(bruto.length < 80) throw new Error("resposta curta demais");

  const inicio = bruto.indexOf("<");
  if(inicio < 0) throw new Error("resposta não é XML");

  const doc = new DOMParser().parseFromString(bruto.slice(inicio), "text/xml");
  if(doc.querySelector("parsererror")) throw new Error("XML inválido");

  const nos = [...doc.querySelectorAll("item"), ...doc.querySelectorAll("entry")];
  if(!nos.length) throw new Error("feed sem itens");

  const itens = [];
  for(const no of nos.slice(0, CONFIG.MAX_POR_FONTE)){
    const item = montarItem({
      veiculo,
      titulo:    texto(no, "title"),
      link:      extrairLink(no),
      resumo:    texto(no, "description", "summary", "content", "encoded"),
      origem:    texto(no, "source", "creator"),
      dataBruta: texto(no, "pubDate", "published", "updated", "date", "modified")
    });
    if(item) itens.push(item);
  }
  if(!itens.length) throw new Error("nenhum item aproveitável");
  return itens;
}

function lerJson(lista, veiculo){
  const itens = [];
  for(const bruto of lista.slice(0, CONFIG.MAX_POR_FONTE)){
    const item = montarItem({ veiculo, ...bruto });
    if(item) itens.push(item);
  }
  if(!itens.length) throw new Error("nenhum item aproveitável");
  return itens;
}

// rss2json e feed2json devolvem o feed já convertido, cada um com nomes próprios
const deRss2json = x => ({
  titulo: x.title, link: x.link || x.guid || "", resumo: x.description || x.content || "",
  origem: x.author || "", dataBruta: x.pubDate || ""
});

const deFeed2json = x => ({
  titulo: x.title, link: x.url || x.external_url || "", resumo: x.summary || x.content_text || x.content_html || "",
  origem: typeof x.author === "string" ? x.author : (x.author?.name || ""), dataBruta: x.date_published || x.date_modified || ""
});

async function pelaPonte(ponte, url, veiculo){
  const abortar = new AbortController();
  const relogio = setTimeout(() => abortar.abort(), CONFIG.TIMEOUT_MS);
  try{
    const r = await fetch(ponte.montar(url), {
      signal: abortar.signal, cache:"no-store", redirect:"follow", referrerPolicy:"no-referrer"
    });
    if(!r.ok){
      const erro = new Error(r.status === 429 ? "excesso de requisições" : "HTTP " + r.status);
      erro.excesso = r.status === 429 || r.status === 503;
      throw erro;
    }

    if(ponte.tipo === "rss2json"){
      const j = await r.json();
      if(j.status !== "ok" || !Array.isArray(j.items)) throw new Error("resposta inválida");
      return lerJson(j.items.map(deRss2json), veiculo);
    }
    if(ponte.tipo === "feed2json"){
      const j = await r.json();
      if(!Array.isArray(j.items)) throw new Error("resposta inválida");
      return lerJson(j.items.map(deFeed2json), veiculo);
    }
    if(ponte.tipo === "envelope"){
      const j = await r.json();
      return lerFeed(decodificarConteudo(j.contents ?? j.body ?? ""), veiculo);
    }
    return lerFeed(await lerTexto(r), veiculo);
  }finally{
    clearTimeout(relogio);
  }
}

/* Tenta as pontes em ordem de saúde; se o feed do veículo estiver fora
   do ar, cai para a busca de reserva no Google Notícias. */
async function buscarFonte(fonte, indice = 0){
  const enderecos = fonte.reserva ? [fonte.u, fonte.reserva] : [fonte.u];
  let ultimoErro = new Error("sem resposta");
  let giro = indice;

  for(const url of enderecos){
    let tentativas = 0;
    for(const ponte of pontes.ordem(giro++)){
      if(tentativas >= CONFIG.TENTATIVAS) break;
      tentativas++;
      try{
        const itens = await pelaPonte(ponte, url, fonte.v);
        pontes.registrar(ponte.id, true);
        return itens;
      }catch(erro){
        // Erro de rede, tempo limite ou recusa é da ponte; XML inválido é do feed
        const daPonte = !/inválido|sem itens|aproveitável|curta demais|não é XML/.test(erro.message || "");
        const motivo = erro.name === "AbortError" ? "tempo esgotado" : (erro.message || "falhou");
        pontes.registrar(ponte.id, !daPonte, daPonte ? motivo : null);
        ultimoErro = erro;
        if(!daPonte) break;              // a ponte entregou: o problema é o feed, vai para a reserva
        if(erro.excesso) await esperar(CONFIG.ESPERA_LIMITE);
      }
    }
  }
  throw ultimoErro;
}

/* ============================================================
   6. CARGA DO PAINEL
   ============================================================ */
function recompor(secaoId){
  const secao = SECOES.find(s => s.id === secaoId);
  const vistos = new Set();
  const itens = [];

  for(const fonte of secao.fontes){
    for(const it of (estado.brutos[secaoId][fonte.v] || [])){
      if(vistos.has(it.chave)) continue;    // deduplicação entre veículos
      vistos.add(it.chave);
      itens.push(it);
    }
  }
  itens.sort((a, b) => b.ts - a.ts);
  estado.itens[secaoId] = itens;
}

async function carregarTudo(){
  if(estado.emCarga) return;
  estado.emCarga = true;
  estado.carregando = true;
  estado.progresso = { feitas:0, total:SECOES.reduce((n, s) => n + s.fontes.length, 0) };
  pontes.zerar();
  SECOES.forEach(s => { estado.falhas[s.id] = []; });

  el("iconeAtualizar").classList.add("girando");
  el("btnAtualizar").disabled = true;
  renderizar();

  // A seção aberta entra na frente da fila: é a que o leitor está olhando
  const ordemDasSecoes = [
    ...SECOES.filter(s => s.id === estado.secao),
    ...SECOES.filter(s => s.id !== estado.secao)
  ];

  const tarefas = [];
  let indice = 0;
  for(const secao of ordemDasSecoes){
    for(const fonte of secao.fontes){
      const meu = indice++;
      tarefas.push(enfileirar(async () => {
        try{
          estado.brutos[secao.id][fonte.v] = await buscarFonte(fonte, meu);
        }catch{
          // Sem resposta agora: preserva o que essa fonte já tinha, marcada no rodapé
          estado.falhas[secao.id].push(fonte.v);
        }
        estado.progresso.feitas++;
        recompor(secao.id);
        renderizarAbas();
        if(secao.id === estado.secao) renderizarGrade();
      }));
    }
  }

  await Promise.all(tarefas);

  estado.carregando = false;
  estado.emCarga = false;
  estado.ultimaAtualizacao = Date.now();
  el("iconeAtualizar").classList.remove("girando");
  el("btnAtualizar").disabled = false;

  guardar.gravar("radar_cache2", {
    brutos: estado.brutos, falhas: estado.falhas, quando: estado.ultimaAtualizacao
  });
  guardar.gravar("radar_visita", Date.now());

  montarFiltroVeiculos();
  renderizar();
}

/* ============================================================
   7. ASSUNTOS DO DIA (frequência de termos nas manchetes)
   ============================================================ */
const VAZIAS = new Set(("a as o os um uma uns umas de do da dos das em no na nos nas por para com sem sob sobre " +
  "e ou mas que quem qual quais quando onde como porque pois se já ainda mais menos muito pouco todo toda todos " +
  "todas este esta estes estas esse essa esses essas aquele aquela isso isto aquilo seu sua seus suas meu minha " +
  "nosso nossa ao aos à às pelo pela pelos pelas ser estar ter haver vai vão foi foram tem têm será serão após " +
  "entre até desde contra durante antes depois ano anos dia dias mês meses hoje ontem diz dizem após novo nova " +
  "novos novas grande grandes maior menor primeiro segunda terceiro contra the and for with from that this what " +
  "how why says said new news video veja saiba entenda leia confira " +
  "milhões bilhões mil cerca apenas também ainda agora nesta neste").split(" "));

function calcularAssuntos(){
  const contagem = new Map();
  const limite = Date.now() - 36 * 3600 * 1000;

  for(const secao of SECOES){
    for(const it of estado.itens[secao.id]){
      if(it.ts && it.ts < limite) continue;

      const palavras = it.titulo
        .replace(/[""''"'`]/g, " ")
        .split(/[\s,.;:!?()\[\]\/—–-]+/)
        .filter(Boolean);

      const usados = new Set();
      for(let i = 0; i < palavras.length; i++){
        const p = palavras[i];
        const base = p.toLowerCase().replace(/[^a-zà-ú0-9]/gi, "");
        if(base.length < 4 || VAZIAS.has(base)) continue;

        // Bigrama quando duas palavras seguidas são próprias (ex.: "Banco Central")
        const prox = palavras[i+1];
        if(prox && i > 0 && /^[A-ZÀ-Ú]/.test(p) && /^[A-ZÀ-Ú]/.test(prox)){
          const b2 = prox.toLowerCase().replace(/[^a-zà-ú0-9]/gi, "");
          if(b2.length >= 4 && !VAZIAS.has(b2)){
            const par = p.replace(/[^\wÀ-ú]/g,"") + " " + prox.replace(/[^\wÀ-ú]/g,"");
            const k = par.toLowerCase();
            if(!usados.has(k)){ usados.add(k); contagem.set(k, { rotulo: par, n: (contagem.get(k)?.n || 0) + 1 }); }
          }
        }
        if(usados.has(base)) continue;
        usados.add(base);
        const anterior = contagem.get(base);
        contagem.set(base, { rotulo: anterior?.rotulo || (/^[A-ZÀ-Ú]/.test(p) ? p.replace(/[^\wÀ-ú]/g,"") : base), n: (anterior?.n || 0) + 1 });
      }
    }
  }

  // Remover unigramas já contidos em bigramas mais fortes
  const lista = [...contagem.entries()]
    .filter(([, v]) => v.n >= 3)
    .sort((a,b) => b[1].n - a[1].n);

  const escolhidos = [];
  for(const [chave, v] of lista){
    if(escolhidos.length >= 12) break;
    const redundante = escolhidos.some(e =>
      e.chave.includes(chave) || chave.includes(e.chave));
    if(redundante) continue;
    escolhidos.push({ chave, rotulo: v.rotulo, n: v.n });
  }
  return escolhidos;
}

function renderizarAssuntos(){
  const faixa = el("faixaAssuntos");
  if(estado.carregando){ faixa.hidden = true; return; }

  const assuntos = calcularAssuntos();
  if(!assuntos.length){ faixa.hidden = true; return; }

  faixa.hidden = false;
  el("listaAssuntos").innerHTML = assuntos.map(a => `
    <button class="chip" data-assunto="${escapar(a.chave)}" aria-pressed="${estado.assuntoAtivo === a.chave}">
      ${escapar(a.rotulo)}<span class="chip-n">${a.n}</span>
    </button>`).join("");
}

/* ============================================================
   8. FILTRAGEM E RENDERIZAÇÃO
   ============================================================ */
function itensFiltrados(){
  let itens = estado.itens[estado.secao] || [];
  const termo = (estado.assuntoAtivo || estado.busca).toLowerCase().trim();

  if(estado.veiculo) itens = itens.filter(i => i.veiculo === estado.veiculo);

  if(estado.periodo){
    const corte = Date.now() - estado.periodo * 3600 * 1000;
    itens = itens.filter(i => !i.ts || i.ts >= corte);
  }

  if(termo){
    itens = itens.filter(i =>
      (i.titulo + " " + i.resumo).toLowerCase().includes(termo));
  }
  return itens;
}

function realcar(texto, termo){
  const seguro = escapar(texto);
  if(!termo) return seguro;
  const padrao = termo.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  try{ return seguro.replace(new RegExp("(" + padrao + ")", "gi"), "<mark>$1</mark>"); }
  catch{ return seguro; }
}

   O que é publicado aqui aparece na aba Patrimar para todo mundo
   que abre o app. O texto mora no banco da Vercel, atrás de
   api/mural.js; o painel só lê e escreve por ali. */
async function carregarMural(){
  try{
    const r = await fetch("/api/mural", { cache:"no-store" });
    const dados = await r.json().catch(() => ({}));
    estado.mural = r.ok
      ? { itens: Array.isArray(dados.avisos) ? dados.avisos : [], carregado:true, erro:"", comoResolver:"" }
      : { itens:[], carregado:true, erro: dados.erro || ("a função respondeu " + r.status), comoResolver: dados.comoResolver || "" };
  }catch(e){
    estado.mural = { itens:[], carregado:true, erro:"mural fora de alcance", comoResolver:"" };

}

function montarMural(){

    miolo = `<div class="mural-lista">${itens.map(a => {
      const corpo = `

      </div>`;
    }).join("")}</div>`;
  }

  return `<section class="mural">
    <div class="mural-topo">

}

    autor: el("pubAutor").value
  };

  if(!corpo.titulo.trim() && !corpo.texto.trim()){
    return mostrarErroPublicacao("Escreva ao menos um título ou um texto.");
  }

  el("btnPublicar").disabled = true;
  try{
    const r = await fetch("/api/mural", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-senha": senha },
      body: JSON.stringify(corpo)
    });
    const dados = await r.json().catch(() => ({}));
    if(!r.ok) return mostrarErroPublicacao(dados.erro || ("a função respondeu " + r.status));

    estado.senhaMural = senha;                 // poupa redigitar nas próximas
    estado.mural.itens.unshift(dados.aviso);
    caixa.close();
    renderizar();
  }catch(e){
    mostrarErroPublicacao(e?.message || "não foi possível publicar");
  }finally{
    el("btnPublicar").disabled = false;
  }
}

function mostrarErroPublicacao(mensagem){
  const alvo = el("pubErro");
  alvo.textContent = mensagem;
  alvo.classList.remove("oculto");
}

async function tirarDoMural(id){
  if(!confirm("Tirar este aviso do mural?")) return;
  const senha = estado.senhaMural || prompt("Senha do mural:") || "";
  try{
    const r = await fetch("/api/mural?id=" + encodeURIComponent(id), {
      method:"DELETE", headers:{ "x-senha": senha }
    });
    const dados = await r.json().catch(() => ({}));
    if(!r.ok){ alert(dados.erro || "não foi possível tirar"); return; }
    estado.senhaMural = senha;
    estado.mural.itens = estado.mural.itens.filter(a => a.id !== id);
    renderizar();
  }catch(e){
    alert(e?.message || "não foi possível tirar");
  }
}

/* ------------------------------------------------------------
   Arquivo
   ------------------------------------------------------------
   Feed RSS só carrega o que saiu nos últimos dias. Para alcançar
   matéria de anos anteriores o caminho é o arquivo do Google
   Notícias, que aceita recorte de data na própria consulta. */
function anosDoArquivo(){
  const atual = new Date().getFullYear();
  return Array.from({ length: CONFIG.ARQUIVO_ANOS }, (_, i) => atual - i);
}

function montarAnosDoArquivo(){
  el("grupoArquivo").innerHTML = anosDoArquivo()
    .map(a => `<option value="ano:${a}">Arquivo de ${a}</option>`).join("");
}

async function buscarNoArquivo(){
  const termo = el("busca").value.trim();
  const ano = estado.arquivo?.ano;
  if(!ano) return;

  if(!termo){
    estado.arquivo = { ano, termo:"", itens:[], carregando:false, erro:"" };
    renderizar();
    return;
  }

  estado.arquivo = { ano, termo, itens:[], carregando:true, erro:"" };
  renderizar();

  // Busca do usuário não entra na fila da atualização: sai na frente
  const consulta = `${termo} after:${ano}-01-01 before:${ano + 1}-01-01`;
  let achados = null, erro = "";
  try{
    achados = await buscarFonte({ v:"Arquivo " + ano, u:gn(consulta) }, 0);
  }catch(e){
    erro = e?.message || "não foi possível consultar o arquivo";
  }

  if(estado.arquivo?.ano !== ano || estado.arquivo?.termo !== termo) return;  // busca vencida

  // O recorte de data é conferido aqui também: se o arquivo devolver matéria
  // de outro ano, ela não passa, e o total de descartadas explica o vazio.
  const todos = achados || [];
  const doAno = todos.filter(i => i.ts && new Date(i.ts).getFullYear() === ano);

  estado.arquivo = {
    ano, termo, erro, carregando:false,
    itens: doAno.sort((a, b) => b.ts - a.ts),
    foraDoAno: todos.length - doAno.length
  };
  renderizar();
}

function montarArquivo(){
  const { ano, termo, itens, carregando, erro } = estado.arquivo;

  if(!termo){
    return `<div class="estado">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <div class="estado-t">Arquivo de ${ano}</div>
      <div class="estado-d">Digite uma palavra-chave no campo de busca e tecle <b>Enter</b>
        para procurar matérias publicadas em ${ano}.</div>
    </div>`;
  }

  const faixa = `<div class="faixa-arquivo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v13H3z"/><path d="M3 7l2-3h14l2 3"/><path d="M10 12h4"/></svg>
    <div><b>Arquivo de ${ano}</b> · resultados para “${escapar(termo)}”, fora da lista do dia.
    Para voltar ao radar, escolha <i>Qualquer período</i>.</div>
  </div>`;

  if(carregando){
    return faixa + Array.from({ length:4 }, () => `
      <div class="esqueleto">
        <div class="esq-linha" style="width:32%;height:9px"></div>
        <div class="esq-linha" style="width:96%"></div>
        <div class="esq-linha" style="width:72%"></div>
      </div>`).join("");
  }

  if(erro){
    return faixa + `<div class="aviso" role="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
      <div><b>A consulta ao arquivo não voltou</b> ${escapar(erro)} — tecle Enter para tentar de novo.</div>
    </div>`;
  }

  if(!itens.length){
    const fora = estado.arquivo.foraDoAno || 0;
    return faixa + `<div class="estado">
      <div class="estado-t">Nada encontrado em ${ano}</div>
      <div class="estado-d">Nenhuma matéria de ${ano} para <b>${escapar(termo)}</b>.
        ${fora ? `O arquivo devolveu ${fora} ${fora === 1 ? "resultado" : "resultados"} de outros anos, que ficaram de fora. ` : ""}
        Tente outras palavras ou outro ano.</div>
    </div>`;
  }

  return faixa + itens.map(i => cartaoNoticia(i, termo)).join("");
}

/* ------------------------------------------------------------
   Resumo do dia
   ------------------------------------------------------------
   Sem IA: a nota de cada manchete vem de quantos assuntos mais
   citados do dia ela contém, com um empurrão para as mais recentes.
   Assunto repetido por vários veículos é o que costuma importar. */
function itensDoResumo(secaoId, quantos, peso){
  const agora = Date.now();
  return (estado.itens[secaoId] || [])
    .map(it => {
      const titulo = it.titulo.toLowerCase();
      let nota = 0;
      peso.forEach((p, chave) => { if(titulo.includes(chave)) nota += p; });
      const horas = it.ts ? (agora - it.ts) / 3600000 : 48;
      return { it, nota: nota * 2 + Math.max(0, 30 - horas) / 5 };
    })
    .sort((a, b) => b.nota - a.nota || b.it.ts - a.it.ts)
    .slice(0, quantos)
    .map(o => o.it);
}

/* A leitura do dia é escrita pelo Claude, na função api/resumir.js. A chave
   da API mora na Vercel; daqui só sai manchete e só volta texto pronto.
   É sob demanda, no botão: cada clique custa alguns centavos. */
async function pedirLeitura(){
  const manchetes = [];
  const assuntos = calcularAssuntos();
  const peso = new Map(assuntos.map((a, i) => [a.chave, assuntos.length - i]));

  for(const secao of SECOES){
    for(const i of itensDoResumo(secao.id, CONFIG.RESUMO_POR_SECAO, peso)){
      manchetes.push({ secao: secao.nome, titulo: i.titulo, veiculo: i.origem || i.veiculo });
    }
  }

  if(!manchetes.length){
    estado.leitura = { texto:"", carregando:false, erro:"não há manchete para ler ainda" };
    renderizar();
    return;
  }

  estado.leitura = { texto:"", carregando:true, erro:"" };
  renderizar();

  try{
    const r = await fetch("/api/resumir", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ itens: manchetes })
    });
    const dados = await r.json().catch(() => ({}));

    if(!r.ok){
      estado.leitura = {
        texto:"", carregando:false,
        erro: dados.erro || ("a função respondeu " + r.status),
        comoResolver: dados.comoResolver || ""
      };
    }else{
      estado.leitura = { texto: dados.resumo || "", carregando:false, erro:"" };
    }
  }catch(e){
    estado.leitura = { texto:"", carregando:false, erro: e?.message || "não foi possível falar com a função" };
  }
  renderizar();
}

function blocoLeitura(){
  const l = estado.leitura;
  const botao = `<button class="btn btn-secundario" id="btnLeitura" ${l?.carregando ? "disabled" : ""}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M18 15l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></svg>
    <span>${l?.texto ? "Reescrever leitura" : "Escrever a leitura do dia"}</span>
  </button>`;

  if(l?.carregando){
    return `<div class="leitura leitura-espera">${botao}<span>Lendo as manchetes…</span></div>`;
  }
  if(l?.erro){
    return `<div class="leitura">${botao}
      <div class="leitura-erro"><b>Não saiu:</b> ${escapar(l.erro)}${
        l.comoResolver ? `<div class="leitura-ajuda">${escapar(l.comoResolver)}</div>` : ""}</div>
    </div>`;
  }
  if(l?.texto){
    return `<div class="leitura">
      <div class="leitura-texto">${l.texto.split(/\n+/).map(p => `<p>${escapar(p)}</p>`).join("")}</div>
      <div class="leitura-pe">Escrito por IA a partir das manchetes acima · confira antes de repassar ${botao}</div>
    </div>`;
  }
  return `<div class="leitura leitura-espera">${botao}<span>Um parágrafo com o fio do dia, escrito na hora.</span></div>`;
}

function montarResumo(){
  const assuntos = calcularAssuntos();
  const peso = new Map(assuntos.map((a, i) => [a.chave, assuntos.length - i]));
  const agora = new Date();
  const hora = estado.ultimaAtualizacao
    ? new Date(estado.ultimaAtualizacao).toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" })
    : agora.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" });

  const blocos = SECOES.map(secao => {
    const itens = itensDoResumo(secao.id, CONFIG.RESUMO_POR_SECAO, peso);
    const total = (estado.itens[secao.id] || []).length;
    if(!itens.length) return "";
    return `<section class="resumo-bloco">
      <div class="resumo-cabeca">
        <span class="resumo-secao">${escapar(secao.nome)}</span>
        <span class="resumo-qtd">${itens.length} de ${total}</span>
      </div>
      <div class="resumo-lista">
        ${itens.map(i => `
        <a class="resumo-item" href="${escapar(i.link)}" target="_blank" rel="noopener noreferrer">
          <div class="resumo-item-t">${escapar(i.titulo)}</div>
          <div class="resumo-item-m">${escapar(i.veiculo)}${
            i.origem && i.origem !== i.veiculo ? " · " + escapar(i.origem) : ""}${
            i.ts ? " · " + escapar(tempoRelativo(i.ts)) : ""}</div>
        </a>`).join("")}
      </div>
    </section>`;
  }).join("");

  if(!blocos){
    return `<div class="estado">
      <div class="estado-t">Ainda não há notícias para resumir</div>
      <div class="estado-d">Use o botão Atualizar e volte ao resumo em seguida.</div>
    </div>`;
  }

  return `<div class="resumo">
    <div class="resumo-abertura">
      <div class="resumo-titulo">Resumo do dia</div>
      <div class="resumo-linha">${escapar(dataExtenso(agora))} · fechado às ${escapar(hora)}</div>
      ${assuntos.length ? `<div class="resumo-termos"><b>Mais citados:</b> ${
        assuntos.slice(0, 8).map(a => escapar(a.rotulo) + " (" + a.n + ")").join(" · ")}</div>` : ""}
    </div>
    ${blocoLeitura()}
    ${blocos}
  </div>`;
}

function cartaoNoticia(i, termo){
  const novo = i.ts && i.ts > estado.ultimaVisita && (Date.now() - i.ts) < 24*3600*1000;
  const alfinete = estado.publicando
    ? `<button class="n-fixar" data-fixar="${escapar(i.chave)}" title="Fixar no mural" aria-label="Fixar no mural">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></svg>
       </button>`
    : "";
  return `<a class="noticia" href="${escapar(i.link)}" target="_blank" rel="noopener noreferrer">${alfinete}
    <div class="n-meta">
      <span class="n-veiculo">${escapar(i.veiculo)}</span>
      ${i.origem && i.origem !== i.veiculo ? `<span class="n-ponto">·</span><span class="n-origem">${escapar(i.origem)}</span>` : ""}
      ${i.ts ? `<span class="n-ponto">·</span><span class="n-hora">${escapar(tempoRelativo(i.ts))}</span>` : ""}
      ${novo ? `<span class="n-novo">novo</span>` : ""}
    </div>
    <div class="n-titulo">${realcar(i.titulo, termo)}</div>
    ${i.resumo ? `<div class="n-resumo">${realcar(i.resumo, termo)}</div>` : ""}
  </a>`;
}

function renderizarAbas(){
  const estrela = `<svg class="aba-estrela" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>`;
  el("abas").innerHTML = SECOES.map(s => {
    const n = (estado.itens[s.id] || []).length;
    return `<button class="aba${s.destaque ? " aba-destaque" : ""}" role="tab" data-secao="${s.id}"
      aria-selected="${estado.secao === s.id}">
      ${s.destaque ? estrela : ""}${escapar(s.nome)}${n ? `<span class="aba-n">${n}</span>` : ""}
    </button>`;
  }).join("");
}

function renderizarGrade(){
  const grade = el("grade");

  if(!estado.arquivo && estado.carregando && !(estado.itens[estado.secao] || []).length){
    grade.innerHTML = Array.from({ length:6 }, () => `
      <div class="esqueleto">
        <div class="esq-linha" style="width:32%;height:9px"></div>
        <div class="esq-linha" style="width:96%"></div>
        <div class="esq-linha" style="width:72%"></div>
        <div class="esq-linha" style="width:52%;height:9px;margin-top:12px"></div>
      </div>`).join("");
    el("contagem").textContent = estado.progresso.total
      ? `Buscando fontes… ${estado.progresso.feitas}/${estado.progresso.total}`
      : "Buscando fontes…";
    return;
  }

  if(estado.arquivo){
    grade.innerHTML = montarArquivo();
    const n = estado.arquivo.itens.length;
    el("contagem").textContent = estado.arquivo.carregando
      ? "Consultando o arquivo…"
      : (estado.arquivo.termo && !estado.arquivo.erro ? `${n} ${n === 1 ? "resultado" : "resultados"} em ${estado.arquivo.ano}` : "");
    return;
  }

  if(estado.resumo){
    grade.innerHTML = montarResumo();
    const total = SECOES.reduce((n, sec) => n + (estado.itens[sec.id] || []).length, 0);
    el("contagem").textContent = total ? `resumo de ${total} notícias` : "";
    return;
  }

  const itens = itensFiltrados();
  const termo = (estado.assuntoAtivo || estado.busca).trim();
  const falhas = estado.falhas[estado.secao] || [];

  let html = "";

  // O mural é da casa: aparece só na aba Patrimar, antes das notícias
  if(estado.secao === "patrimar" && estado.mural.carregado) html += montarMural();

  if(falhas.length && !estado.carregando){
    const secaoAtual = SECOES.find(s => s.id === estado.secao);
    const tudoFora = falhas.length === secaoAtual.fontes.length;
    html += `<div class="aviso" role="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
      <div>${tudoFora
        ? `<b>Nenhuma fonte respondeu nesta atualização</b>
           As pontes públicas que trazem os feeds até o navegador podem estar fora do ar ou o aparelho está sem
           conexão. Toque em Atualizar em alguns minutos. Se persistir, publique um Apps Script próprio e informe
           a URL em <code>CONFIG.PROXY_PROPRIO</code> no <code>index.html</code>.
           ${pontes.resumo() ? `<div class="aviso-detalhe">${escapar(pontes.resumo())}</div>` : ""}`
        : `<b>${falhas.length} fonte${falhas.length > 1 ? "s" : ""} sem resposta nesta atualização</b>
           ${escapar(falhas.join(", "))} — o restante do painel está completo. Tente atualizar em alguns minutos.`}
      </div>
    </div>`;
  }

  if(!itens.length){
    html += `<div class="estado">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <div class="estado-t">Nenhuma notícia encontrada</div>
      <div class="estado-d">${termo
        ? "Nenhum resultado para <b>" + escapar(termo) + "</b> nesta seção. Tente outro termo ou remova os filtros."
        : "As fontes desta seção não retornaram conteúdo. Use o botão Atualizar."}</div>
    </div>`;
    grade.innerHTML = html;
    el("contagem").textContent = "0 notícias";
    return;
  }

  html += itens.map(i => cartaoNoticia(i, termo)).join("");

  grade.innerHTML = html;

  const total = (estado.itens[estado.secao] || []).length;
  const plural = n => n === 1 ? "1 notícia" : `${n} notícias`;
  el("contagem").textContent = itens.length === total
    ? plural(total)
    : `${itens.length} de ${plural(total)}`;
}

function renderizarRodape(){
  const falhas = new Set();
  SECOES.forEach(s => (estado.falhas[s.id] || []).forEach(v => falhas.add(v)));

  const veiculos = new Set();
  SECOES.forEach(s => s.fontes.forEach(f => veiculos.add(f.v)));

  el("statusFontes").innerHTML = [...veiculos].map(v => `
    <span class="fonte-tag" title="${falhas.has(v) ? "Sem resposta na última atualização" : "Respondendo normalmente"}">
      <span class="bolinha ${falhas.has(v) ? "falha" : "ok"}"></span>${escapar(v)}
    </span>`).join("");

  el("rodapeInfo").textContent = estado.ultimaAtualizacao
    ? "Atualizado às " + new Date(estado.ultimaAtualizacao).toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" })
    : "";

  el("subtitulo").textContent = "Patrimar Móveis · " + dataExtenso(new Date());
  el("folhaData").textContent = dataExtenso(new Date()) +
    (estado.ultimaAtualizacao
      ? " · atualizado às " + new Date(estado.ultimaAtualizacao).toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" })
      : "");
}

function renderizar(){
  renderizarAbas();
  renderizarAssuntos();
  renderizarGrade();
  renderizarRodape();
}

function montarFiltroVeiculos(){
  const sel = el("filtroVeiculo");
  const atual = sel.value;
  const secao = SECOES.find(s => s.id === estado.secao);
  sel.innerHTML = '<option value="">Todos os veículos</option>' +
    secao.fontes.map(f => `<option value="${escapar(f.v)}">${escapar(f.v)}</option>`).join("");
  sel.value = [...sel.options].some(o => o.value === atual) ? atual : "";
  estado.veiculo = sel.value;
}

/* ============================================================
   9. EVENTOS
   ============================================================ */
el("abas").addEventListener("click", e => {
  const aba = e.target.closest("[data-secao]");
  if(!aba) return;
  estado.secao = aba.dataset.secao;
  if(estado.resumo){ estado.resumo = false; aplicarModoResumo(); }
  if(estado.arquivo){ estado.arquivo = null; el("filtroPeriodo").value = "0"; ajustarBuscaArquivo(); }
  montarFiltroVeiculos();
  renderizar();
  window.scrollTo({ top:0, behavior:"smooth" });
});

el("listaAssuntos").addEventListener("click", e => {
  const chip = e.target.closest("[data-assunto]");
  if(!chip) return;
  const valor = chip.dataset.assunto;
  estado.assuntoAtivo = estado.assuntoAtivo === valor ? null : valor;
  if(estado.assuntoAtivo){ el("busca").value = ""; estado.busca = ""; el("btnLimpar").classList.add("oculto"); }
  renderizar();
});

let temporizadorBusca;
el("busca").addEventListener("input", e => {
  clearTimeout(temporizadorBusca);
  el("btnLimpar").classList.toggle("oculto", !e.target.value);
  if(estado.arquivo) return;          // no arquivo, quem manda é o Enter
  temporizadorBusca = setTimeout(() => {
    estado.busca = e.target.value;
    estado.assuntoAtivo = null;
    renderizar();
  }, 220);
});

el("btnLimpar").addEventListener("click", () => {
  el("busca").value = "";
  estado.busca = "";
  el("btnLimpar").classList.add("oculto");
  if(estado.arquivo) estado.arquivo = { ...estado.arquivo, termo:"", itens:[], erro:"", carregando:false };
  renderizar();
  el("busca").focus();
});

el("btnResumo").addEventListener("click", () => {
  estado.resumo = !estado.resumo;
  if(estado.resumo && estado.arquivo){
    estado.arquivo = null;
    el("filtroPeriodo").value = "0";
    ajustarBuscaArquivo();
  }
  aplicarModoResumo();
  renderizar();
  window.scrollTo({ top:0, behavior:"smooth" });
});

el("btnImprimir").addEventListener("click", () => window.print());

el("grade").addEventListener("click", e => {
  if(e.target.closest("#btnLeitura")){ pedirLeitura(); return; }

  if(e.target.closest("#btnRecado")){
    abrirPublicacao({ tipo:"recado" });
    return;
  }

  if(e.target.closest("#btnFixarModo")){
    estado.publicando = !estado.publicando;
    renderizar();
    return;
  }

  const tirar = e.target.closest("[data-tirar]");
  if(tirar){ tirarDoMural(tirar.dataset.tirar); return; }

  // O alfinete mora dentro do cartão, que é um link: segurar o clique
  const fixar = e.target.closest("[data-fixar]");
  if(fixar){
    e.preventDefault();
    e.stopPropagation();
    const chave = fixar.dataset.fixar;
    const noticia = (estado.itens[estado.secao] || []).find(i => i.chave === chave);
    if(noticia) abrirPublicacao({
      tipo:"noticia",
      titulo: noticia.titulo,
      texto: "",
      link: noticia.link
    });
  }
});

el("dlgPublicar").addEventListener("close", () => {
  if(el("dlgPublicar").returnValue === "publicar") return;   // já tratado no submit
});

el("btnPublicar").addEventListener("click", e => {
  e.preventDefault();          // o form fecharia sozinho antes de publicar
  publicarNoMural();
});

// No resumo os filtros não valem: ficam desligados para não enganar
function aplicarModoResumo(){
  el("btnResumo").setAttribute("aria-pressed", String(estado.resumo));
  ["busca", "filtroVeiculo", "filtroPeriodo"].forEach(id => { el(id).disabled = estado.resumo; });
}

el("filtroVeiculo").addEventListener("change", e => { estado.veiculo = e.target.value; renderizar(); });
el("filtroPeriodo").addEventListener("change", e => {
  const valor = e.target.value;

  if(valor.startsWith("ano:")){
    const ano = Number(valor.slice(4));
    estado.periodo = 0;
    if(estado.resumo){ estado.resumo = false; aplicarModoResumo(); }
    estado.arquivo = { ano, termo:"", itens:[], carregando:false, erro:"" };
    ajustarBuscaArquivo();
    buscarNoArquivo();          // se já houver palavra digitada, consulta na hora
    renderizar();
    return;
  }

  estado.arquivo = null;
  estado.periodo = Number(valor);
  ajustarBuscaArquivo();
  renderizar();
});

// No arquivo a busca não filtra a lista: ela dispara a consulta ao teclar Enter
function ajustarBuscaArquivo(){
  el("busca").placeholder = estado.arquivo
    ? `Buscar no arquivo de ${estado.arquivo.ano} e teclar Enter…`
    : "Buscar por palavra-chave…";
}

el("busca").addEventListener("keydown", e => {
  if(e.key === "Enter" && estado.arquivo){
    e.preventDefault();
    clearTimeout(temporizadorBusca);
    buscarNoArquivo();
  }
});
el("btnAtualizar").addEventListener("click", () => carregarTudo());

el("btnTema").addEventListener("click", () => {
  const novo = document.documentElement.dataset.tema === "escuro" ? "claro" : "escuro";
  aplicarTema(novo);
  guardar.gravar("radar_tema", novo);
});

/* ------------------------------------------------------------
   Instalação como aplicativo
   ------------------------------------------------------------ */
let promptInstalacao = null;

const emAplicativo = () =>
  window.matchMedia?.("(display-mode: standalone)").matches ||
  window.matchMedia?.("(display-mode: minimal-ui)").matches ||
  navigator.standalone === true;

// Chrome e Edge avisam quando o app pode ser instalado; só então o botão aparece
window.addEventListener("beforeinstallprompt", evento => {
  evento.preventDefault();
  promptInstalacao = evento;
  el("btnInstalar").classList.remove("oculto");
});

el("btnInstalar").addEventListener("click", async () => {
  if(!promptInstalacao) return;
  promptInstalacao.prompt();
  const escolha = await promptInstalacao.userChoice;
  promptInstalacao = null;
  if(escolha?.outcome === "accepted") el("btnInstalar").classList.add("oculto");
});

window.addEventListener("appinstalled", () => {
  promptInstalacao = null;
  el("btnInstalar").classList.add("oculto");
  el("dicaInstalar").hidden = true;
  guardar.gravar("radar_dica_instalar", 1);
});

el("btnDicaFechar").addEventListener("click", () => {
  el("dicaInstalar").hidden = true;
  guardar.gravar("radar_dica_instalar", 1);
});

// O Safari não oferece o convite automático: no iPhone a dica explica o caminho
/* A barra de seções gruda logo abaixo do cabeçalho. Como a altura muda com
   o tamanho da tela, ela é medida em vez de chutada. */
function medirCabecalho(){
  const alt = document.querySelector(".topo")?.offsetHeight;
  if(alt) document.documentElement.style.setProperty("--h-topo", alt + "px");
}

function avaliarDicaInstalar(){
  if(emAplicativo() || guardar.ler("radar_dica_instalar")) return;
  const ua = navigator.userAgent;
  const ios = /iphone|ipad|ipod/i.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if(ios && !/crios|fxios|edgios|opios/i.test(ua)) el("dicaInstalar").hidden = false;
}

function aplicarTema(tema){
  document.documentElement.dataset.tema = tema;
  el("iconeTema").innerHTML = tema === "escuro"
    ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
    : '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>';
  el("btnTema").title = tema === "escuro" ? "Mudar para tema claro" : "Mudar para tema escuro";
}

document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== el("busca")){
    e.preventDefault(); el("busca").focus();
  }
  if(e.key === "Escape" && document.activeElement === el("busca")) el("btnLimpar").click();
});

// Reatualiza ao voltar para a aba, se estiver defasado
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && estado.ultimaAtualizacao &&
     Date.now() - estado.ultimaAtualizacao > CONFIG.INTERVALO_MS){
    carregarTudo();
  }
});

/* ============================================================
  10. INICIALIZAÇÃO
   ============================================================ */
(function iniciar(){
  aplicarTema(guardar.ler("radar_tema") ||
    (window.matchMedia?.("(prefers-color-scheme: dark)").matches ? "escuro" : "claro"));

  estado.ultimaVisita = guardar.ler("radar_visita") || 0;

  // Exibe o cache imediatamente para a tela não abrir vazia
  const cache = guardar.ler("radar_cache2");
  if(cache?.brutos){
    SECOES.forEach(s => {
      estado.brutos[s.id] = cache.brutos[s.id] || {};
      recompor(s.id);
    });
    estado.falhas = cache.falhas || estado.falhas;
    estado.ultimaAtualizacao = cache.quando;
    estado.carregando = false;
    montarFiltroVeiculos();
  }
  renderizar();

  montarAnosDoArquivo();
  avaliarDicaInstalar();
  medirCabecalho();
  window.addEventListener("resize", medirCabecalho);
  if(window.ResizeObserver) new ResizeObserver(medirCabecalho).observe(document.querySelector(".topo"));
  document.fonts?.ready.then(medirCabecalho).catch(() => {});

  carregarMural();
  carregarTudo();
  setInterval(() => { if(document.visibilityState === "visible") carregarTudo(); }, CONFIG.INTERVALO_MS);

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>
